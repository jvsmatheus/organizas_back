name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore Organizas.slnx

      - name: Compilar
        run: dotnet build Organizas.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test Organizas.slnx --configuration Release --no-build

      - name: Publicar para Linux
        run: dotnet publish Organizas/Organizas.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Salvar artefato de publicação
        uses: actions/upload-artifact@v4
        with:
          name: organizas-api
          path: ./publish
          retention-days: 5

  prepare-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verificar subject OIDC
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("sub=" + claims["sub"])
          PY

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::191518191172:role/OrganizasGitHubRole
          aws-region: us-east-1

      - name: Baixar artefato da aplicação
        uses: actions/download-artifact@v5
        with:
          name: organizas-api
          path: ./deploy

      - name: Verificar arquivos do deploy
        run: ls -la ./deploy
          