name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore Organizas.slnx

      - name: Compilar
        run: dotnet build Organizas.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test Organizas.slnx --configuration Release --no-build

      - name: Publicar para Linux
        run: dotnet publish Organizas/Organizas.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Salvar artefato de publicação
        uses: actions/upload-artifact@v4
        with:
          name: organizas-api
          path: ./publish
          retention-days: 5

  prepare-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Inspecionar claims OIDC
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::191518191172:role/OrganizasGitHubRole
          aws-region: us-east-1

      - name: Baixar artefato da aplicação
        uses: actions/download-artifact@v5
        with:
          name: organizas-api
          path: ./deploy

      - name: Verificar arquivos do deploy
        run: ls -la ./deploy
          