name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore Organizas.slnx

      - name: Compilar
        run: dotnet build Organizas.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test Organizas.slnx --configuration Release --no-build

      - name: Publicar para Linux
        run: dotnet publish Organizas/Organizas.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Restaurar ferramentas do repositório
        run: dotnet tool restore

      - name: Gerar bundle de migrations
        run: |
          dotnet ef migrations bundle \
            --project Organizas/Organizas.csproj \
            --configuration Release \
            --self-contained \
            --target-runtime linux-x64 \
            --output ./publish/efbundle

      - name: Incluir script de migrations na publicação
        run: cp .github/scripts/apply-migrations.sh ./publish/apply-migrations.sh

      - name: Salvar artefato de publicação
        uses: actions/upload-artifact@v4
        with:
          name: organizas-api
          path: ./publish
          retention-days: 5

  prepare-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    concurrency:
      group: organizas-production
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::191518191172:role/OrganizasGitHubRole
          aws-region: us-east-1

      - name: Testar acesso à EC2 pelo SSM
        shell: bash
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids i-0de61b7142ce73212 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["systemctl is-active organizas"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "Comando SSM: $command_id"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id i-0de61b7142ce73212

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id i-0de61b7142ce73212 \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}' \
            --output json

      - name: Baixar artefato da aplicação
        uses: actions/download-artifact@v5
        with:
          name: organizas-api
          path: ./deploy

      - name: Verificar arquivos do deploy
        run: ls -la ./deploy

      - name: Compactar pacote da aplicação
        shell: bash
        run: |
          tar --create --gzip \
            --file organizas-api.tar.gz \
            --directory ./deploy .

      - name: Enviar pacote ao S3
        shell: bash
        run: |
          aws s3 cp organizas-api.tar.gz \
            "s3://organizas-deploy/releases/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/organizas-api.tar.gz"
          